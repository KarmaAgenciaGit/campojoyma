services:
  netagro-api-gateway:
    image: nginx:1.28.3-alpine
    container_name: netagro-api-gateway
    restart: unless-stopped
    environment:
      NETAGRO_API_SHARED_SECRET: ${NETAGRO_API_SHARED_SECRET:?NETAGRO_API_SHARED_SECRET is required}
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - traefik_net
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/gateway-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_net"
      traefik.http.routers.netagro-api-v3.rule: "Host(`netagro-api-v2.srv894901.hstgr.cloud`)"
      traefik.http.routers.netagro-api-v3.entrypoints: "websecure"
      traefik.http.routers.netagro-api-v3.tls: "true"
      traefik.http.routers.netagro-api-v3.tls.certresolver: "mytlschallenge"
      traefik.http.services.netagro-api-v3.loadbalancer.server.port: "8080"

networks:
  traefik_net:
    external: true
    name: traefik_net
