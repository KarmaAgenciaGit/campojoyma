server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- SPA fallback ---
  location / {
    try_files $uri $uri/ /index.html;
  }

  # --- Evitar caché del index.html ---
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # --- Static cache (opcional) ---
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ====== PROXY A LA API (PRODUCCIÓN) ======
  # Endpoint real de la API AgroIris
  # Puerto 7000: API principal (calibre, genero, cliente, etc.)
  # Puerto 7001: API de configuración (divisas, series, tipos de cultivo, etc.)

  # /agroiris-api → proxy a la API principal (puerto 7000)
  # Reescribe /agroiris-api/* a /api/* (igual que en vite.config.ts)
  location /agroiris-api/ {
    rewrite ^/agroiris-api/(.*) /api/$1 break;
    proxy_pass http://46.24.40.100:7000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # /agroiris-api-cuentaventa → proxy para cuentas de venta (puerto 7000)
  # Reescribe /agroiris-api-cuentaventa/* a /api/* (igual que en vite.config.ts)
  location /agroiris-api-cuentaventa/ {
    rewrite ^/agroiris-api-cuentaventa/(.*) /api/$1 break;
    proxy_pass http://46.24.40.100:7000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # /agroiris-config → proxy a la API de configuración (puerto 7001)
  # Reescribe /agroiris-config/* a /api/* (igual que en vite.config.ts)
  location /agroiris-config/ {
    rewrite ^/agroiris-config/(.*) /api/$1 break;
    proxy_pass http://46.24.40.100:7001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # /agroiris-login → proxy para login (puerto 7001)
  # Reescribe /agroiris-login/* a /api/* (igual que en vite.config.ts)
  location /agroiris-login/ {
    rewrite ^/agroiris-login/(.*) /api/$1 break;
    proxy_pass http://46.24.40.100:7001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # /agroiris-login-cuentaventa → proxy login cuentas de venta (puerto 7001)
  # Reescribe /agroiris-login-cuentaventa/* a /api/* (igual que en vite.config.ts)
  location /agroiris-login-cuentaventa/ {
    rewrite ^/agroiris-login-cuentaventa/(.*) /api/$1 break;
    proxy_pass http://46.24.40.100:7001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # /agroiris-divisa → proxy para divisas (puerto 7001)
  # Reescribe /agroiris-divisa/* a /api/divisa/* (igual que en vite.config.ts)
  location /agroiris-divisa/ {
    rewrite ^/agroiris-divisa/(.*) /api/divisa/$1 break;
    proxy_pass http://46.24.40.100:7001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # Sin barra final para coincidir con el código que hace fetch('/agroiris-divisa/')
  location /agroiris-divisa {
    rewrite ^/agroiris-divisa$ /api/divisa/ break;
    proxy_pass http://46.24.40.100:7001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # /agroiris-serie → proxy para series (puerto 7001)
  # Reescribe /agroiris-serie/* a /api/serie/* (igual que en vite.config.ts)
  location /agroiris-serie/ {
    rewrite ^/agroiris-serie/(.*) /api/serie/$1 break;
    proxy_pass http://46.24.40.100:7001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # Sin barra final para coincidir con el código que hace fetch('/agroiris-serie')
  location /agroiris-serie {
    rewrite ^/agroiris-serie$ /api/serie/ break;
    proxy_pass http://46.24.40.100:7001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
